name: Clean Storyboard Admin Blocks

on:
  push:
    branches:
      - neurocine-clean-ai-engine

permissions:
  contents: write

jobs:
  clean:
    if: contains(github.event.head_commit.message, 'trigger storyboard cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neurocine-clean-ai-engine
      - name: Remove legacy admin/account/project blocks from storyboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/storyboard/page.js')
          s = p.read_text(encoding='utf-8')
          before = s

          for line in [
              'import UserDashboard from "../../components/UserDashboard";\n',
              'import BillingPanel from "../../components/BillingPanel";\n',
              'import CloudProjectsPanel from "../../components/CloudProjectsPanel";\n',
              'import AdminPanel from "../../components/AdminPanel";\n',
          ]:
              s = s.replace(line, '')

          patterns = [
              r'\n\s*\{isSignedIn && <UserDashboard[^\n]*?/>\}\n',
              r'\n\s*\{isSignedIn && <BillingPanel[^\n]*?/>\}\n',
              r'\n\s*\{isSignedIn && \(accountAccess\.isOwner \|\| accountAccess\.isAdmin\) && <AdminPanel[^\n]*?/>\}\n',
              r'\n\s*\{isSignedIn && \(\s*<section id="projects" className="nc-projects-anchor">\s*<CloudProjectsPanel[\s\S]*?</section>\s*\)\}\n',
          ]
          for pattern in patterns:
              s = re.sub(pattern, '\n', s, count=1)

          p.write_text(s, encoding='utf-8')
          if s == before:
              print('No storyboard cleanup changes needed')
          else:
              print('Storyboard cleanup complete')
              for token in ['UserDashboard', 'BillingPanel', 'CloudProjectsPanel', 'AdminPanel']:
                  print(token, s.count(token))
          PY
      - name: Commit cleanup
        run: |
          git config user.name "neurocine-cleanup-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git add app/storyboard/page.js
          git commit -m "refactor(storyboard): remove legacy admin account project panels"
          git push origin neurocine-clean-ai-engine
